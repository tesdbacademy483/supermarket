services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: supermarket_production
      POSTGRES_USER: supermarket_app
      POSTGRES_PASSWORD: ${SUPERMARKET_DB_PASSWORD:?Set SUPERMARKET_DB_PASSWORD}
    volumes:
      - supermarket_production_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket_app -d supermarket_production"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - supermarket_internal

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "shop.tesdbacademy.com,localhost,127.0.0.1,backend"
      DB_NAME: supermarket_production
      DB_USER: supermarket_app
      DB_PASSWORD: ${SUPERMARKET_DB_PASSWORD:?Set SUPERMARKET_DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supermarket_internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:18082:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - supermarket_internal

volumes:
  supermarket_production_pgdata:

networks:
  supermarket_internal:
    internal: true

